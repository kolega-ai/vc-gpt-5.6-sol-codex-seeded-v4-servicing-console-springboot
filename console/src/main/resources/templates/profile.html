<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Profile')}"></head><body><aside th:replace="~{fragments :: nav}"></aside><main class="workspace narrow"><header class="page-head"><div><p class="eyebrow">Your account</p><h1>Profile &amp; session</h1><p>Security-controlled attributes cannot be changed here.</p></div></header><section class="panel"><form method="post" class="stack"><label>Display name<input name="displayName" th:value="${currentUser.email}" maxlength="40"></label><label>Work email<input th:value="${currentUser.email}" disabled></label><div class="confirmation"><b>Authority is managed separately</b><p>Role, branch, region, limits and delegation can only be changed by Security Administration.</p></div><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button primary">Save profile</button></form></section></main></body></html>

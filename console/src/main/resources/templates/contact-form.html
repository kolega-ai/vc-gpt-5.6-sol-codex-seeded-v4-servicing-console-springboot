<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Update contact')}"></head><body><aside th:replace="~{fragments :: nav}"></aside><main class="workspace narrow"><a class="back" th:href="@{/customers/{id}(id=${page.core.customer.id})}">← Customer 360</a><header class="page-head"><div><p class="eyebrow">Confirmation required</p><h1>Update contact details</h1><p th:text="'Changes for '+${page.core.customer.fullName}+' will be written to core and the audit history.'"></p></div></header><section class="panel"><form method="post" th:object="${form}" class="stack"><label>Phone<input th:field="*{phone}" th:placeholder="${page.core.customer.phone}" maxlength="40" required><small th:errors="*{phone}"></small></label><label>Email<input th:field="*{email}" type="email" th:placeholder="${page.core.customer.email}" maxlength="160" required><small th:errors="*{email}"></small></label><div class="confirmation"><b>Before you save</b><p>Confirm these details were supplied by the customer through an authenticated contact.</p></div><input type="hidden" name="returnTo" th:value="${returnTo}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-actions"><a class="button" th:href="@{/customers/{id}(id=${page.core.customer.id})}">Cancel</a><button class="button primary">Save confirmed details</button></div></form></section></main></body></html>

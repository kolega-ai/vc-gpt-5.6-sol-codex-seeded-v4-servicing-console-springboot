<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Transactions')}"></head><body><aside th:replace="~{fragments :: nav}"></aside><main class="workspace"><a class="back" th:href="@{/customers/{id}(id=${customer.id})}">← Customer 360</a><header class="page-head"><div><p class="eyebrow" th:text="${customer.id}">C0001</p><h1>Transaction history</h1><p th:text="${customer.fullName}">Customer</p></div><a class="button" th:href="@{/customers/{id}/transactions.csv(id=${customer.id})}">Export CSV</a><a class="button" th:href="@{/customers/{id}/statements/{ref}(id=${customer.id},ref='statement-2026-08.csv')}">Statement archive</a></header><section class="panel"><form class="filters"><label>Search description or reference<input name="q" placeholder="e.g. energy or TX-000123"></label><label>Sort by<select name="sort"><option value="date">Booking date</option><option value="amount">Amount</option><option value="description">Description</option></select></label><label>Direction<select name="direction"><option value="desc">Newest / highest</option><option value="asc">Oldest / lowest</option></select></label><button class="button primary">Apply filters</button></form></section><section class="panel table-panel"><table><thead><tr><th>Date</th><th>Description</th><th>Reference</th><th>Channel</th><th class="right">Amount</th></tr></thead><tbody><tr th:each="t:${transactions}"><td th:text="${#temporals.format(t.bookingDate,'dd MMM yyyy')}"></td><td th:text="${t.description}"></td><td class="mono" th:text="${t.reference}"></td><td><span class="badge" th:text="${t.channel}"></span></td><td class="money" th:classappend="${t.amount.signum()<0}?'negative'" th:text="${#numbers.formatDecimal(t.amount,1,2)}+' '+${t.currency}"></td></tr></tbody></table></section><section class="panel"><h2>Recently viewed statement</h2><p>Re-open the statement file your browser last remembered for this customer.</p><a class="button" th:href="@{/customers/{id}/statement-view(id=${customer.id})}" onclick="document.cookie='STATEMENT_VIEW=statement-2026-08.csv;path=/'">Open recent statement</a></section></main></body></html>

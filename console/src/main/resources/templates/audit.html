<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Audit trail')}"></head><body><aside th:replace="~{fragments :: nav}"></aside><main class="workspace"><header class="page-head"><div><p class="eyebrow">Append-only evidence</p><h1>Redacted audit trail</h1><p>Customer references are opaque. Names and account numbers are never included.</p></div><a class="button" href="/admin/audit/export.csv">Export redacted CSV</a><a class="button" href="/admin/audit/notices.csv">Export notice queue</a></header><section class="panel"><form class="filters"><label>Actor<input name="actor" placeholder="EMP003"></label><label>Action<input name="action" placeholder="CUSTOMER_READ"></label><label>Customer ref<input name="customerRef" placeholder="Opaque ref"></label><button class="button">Filter</button></form></section><section class="panel table-panel"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Resource</th><th>Count</th><th>Opaque customer ref</th><th>Basis</th></tr></thead><tbody><tr th:each="e:${events}"><td th:text="${#temporals.format(e.occurredAt,'dd MMM HH:mm')}"></td><td class="mono" th:text="${e.actor}"></td><td th:text="${e.action}"></td><td th:text="${e.resourceClass}"></td><td th:text="${e.recordCount}"></td><td class="mono" th:text="${e.customerRef?:'—'}"></td><td th:text="${e.authorizationBasis}"></td></tr></tbody></table></section></main></body></html>

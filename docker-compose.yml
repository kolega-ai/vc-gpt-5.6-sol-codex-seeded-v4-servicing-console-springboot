services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servicing
      POSTGRES_USER: servicing
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicing"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [servicing-data:/var/lib/postgresql/data]
  entitlements-service:
    build: {context: ., dockerfile: entitlements-service/Dockerfile}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/servicing?currentSchema=entitlements
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only}
      TOKEN_SECRET: ${TOKEN_SECRET:-local-development-signing-key-change-me-32chars}
      INTERNAL_CLIENT_SECRET: ${INTERNAL_CLIENT_SECRET:-local-console-client-secret}
    depends_on: {postgres: {condition: service_healthy}}
  core-mock:
    build: {context: ., dockerfile: core-mock/Dockerfile}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/servicing?currentSchema=core
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only}
      TOKEN_SECRET: ${TOKEN_SECRET:-local-development-signing-key-change-me-32chars}
    depends_on: {postgres: {condition: service_healthy}}
  console:
    build: {context: ., dockerfile: console/Dockerfile}
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/servicing?currentSchema=console
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only}
      ENTITLEMENTS_URL: http://entitlements-service:8081
      CORE_URL: http://core-mock:8082
      INTERNAL_CLIENT_SECRET: ${INTERNAL_CLIENT_SECRET:-local-console-client-secret}
      UPLOAD_DIR: /data/uploads
    volumes: [servicing-uploads:/data/uploads]
    depends_on: [entitlements-service, core-mock]
volumes:
  servicing-data:
  servicing-uploads:
